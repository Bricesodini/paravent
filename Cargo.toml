[workspace]

[package]
name = "paravent"
version = "0.1.0"
edition = "2021"
description = "Filtre entre un agent et des données personnelles : agir sans voir"
license = "MIT"
repository = "https://github.com/Bricesodini/paravent"
readme = "README.md"
publish = false

# Dépendances : celles de docs/cadrage.md, et elles seules.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"

[[example]]
name = "source_aveugle"
path = "exemples/source_aveugle.rs"
